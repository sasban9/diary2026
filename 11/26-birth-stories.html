const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const KEY="stillbirth-verified-v1";let st={};
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const PAGE=150;let limit=PAGE,cur=[];
const years=[...new Set(D.map(v=>v[3].slice(0,4)))];
$("yr").innerHTML='<option value="">All years</option>'+years.map(y=>'<option>'+y+'</option>').join("");
$("all").textContent=D.length;
function fmtDate(d){const p=d.split("-");return (p[2]?+p[2]+" ":"")+MON[+p[1]-1]+" "+p[0]}
function fmtViews(n){return n<0?"":n>=1e6?(n/1e6).toFixed(1)+"M views":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"K views":n+" views"}
function filt(){
  const q=$("q").value.trim().toLowerCase(),y=$("yr").value,ho=$("hideOff").checked,hd=$("hideDone").checked;
  return D.filter(v=>(!q||(v[1]+" "+v[2]).toLowerCase().includes(q))&&(!y||v[3].startsWith(y))&&(!ho||v[6])&&(!hd||!st[v[0]]));
}
function stats(){
  const d=cur.filter(v=>st[v[0]]).length;
  $("shown").textContent=cur.length;$("done").textContent=d;
  $("fill").style.width=(cur.length?d/cur.length*100:0)+"%";
}
function card(v,i){
  const url="https://www.youtube.com/watch?v="+v[0];
  const c=document.createElement("div");c.className="card"+(i<12?" a":"")+(st[v[0]]?" ok":"")+(v[6]?"":" off");
  if(i<12)c.style.animationDelay=(i*60)+"ms";
  c.innerHTML='<div class="num"></div><div><a class="title" target="_blank" rel="noopener noreferrer"></a><div class="meta"><span class="ch"></span><span class="d"></span><span class="vw"></span></div></div><div class="act"><label class="chk"><input type="checkbox"> Verified</label><a class="watch" target="_blank" rel="noopener noreferrer">Watch ↗</a></div>';
  c.querySelector(".num").textContent=i+1;
  const t=c.querySelector(".title");t.href=url;t.textContent=v[1];
  c.querySelector(".ch").textContent=v[2];
  c.querySelector(".d").textContent=fmtDate(v[3]);
  c.querySelector(".vw").textContent=[fmtViews(v[4]),v[5]].filter(Boolean).join(" · ");
  if(v[7]){const s=document.createElement("span");s.className="tag";s.textContent="Original 10";c.querySelector(".meta").appendChild(s)}
  c.querySelector(".watch").href=url;
  const cb=c.querySelector("input");cb.checked=!!st[v[0]];
  cb.onchange=()=>{st[v[0]]=cb.checked;c.classList.toggle("ok",cb.checked);try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}stats();if($("hideDone").checked&&cb.checked){c.remove()}};
  return c;
}
function render(){
  cur=filt();const L=$("list");L.textContent="";
  if(!cur.length){L.innerHTML='<div class="empty">No videos match.</div>'}
  let ly="";
  cur.slice(0,limit).forEach((v,i)=>{
    const y=v[3].slice(0,4);
    if(y!==ly){ly=y;const h=document.createElement("div");h.className="year";h.innerHTML='<span></span><small></small>';h.firstChild.textContent=y;h.lastChild.textContent=cur.filter(x=>x[3].startsWith(y)).length+" videos";L.appendChild(h)}
    L.appendChild(card(v,i));
  });
  $("more").hidden=cur.length<=limit;
  $("more").textContent="Show "+Math.min(PAGE,cur.length-limit)+" more ("+(cur.length-limit)+" left)";
  stats();
}
["q","yr","hideOff","hideDone"].forEach(i=>$(i).addEventListener("input",()=>{limit=PAGE;render()}));
$("more").onclick=()=>{limit+=PAGE;render()};
$("exp").onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const t="\ufeffurl,title,channel,published,views,length,verified\n"+cur.map(v=>["https://www.youtube.com/watch?v="+v[0],v[1],v[2],v[3],v[4]<0?"":v[4],v[5],st[v[0]]?"yes":""].map(q).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="video-index.csv";a.click();
};
render();
</script>
