<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Trillionaire Calculator</title>
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--text:#1a1a1a;--muted:#5d5d58;--line:#dcdad2;--accent:#1d6b4f;--accent-soft:#e3f1ea;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141513;--card:#1e201d;--text:#f0efe9;--muted:#a6a59d;--line:#34362f;--accent:#5fd1a0;--accent-soft:#1f3329}
}
:root[data-theme="dark"]{--bg:#141513;--card:#1e201d;--text:#f0efe9;--muted:#a6a59d;--line:#34362f;--accent:#5fd1a0;--accent-soft:#1f3329}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
.top{text-align:center;padding:24px 0 20px}
.top small{display:block;color:var(--muted);font-size:16px}
.top h1{margin:4px 0 0;font-size:clamp(44px,12vw,72px);line-height:1.05;letter-spacing:-0.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.row label{font-weight:600}
.row output{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:16px;margin:8px 0 0}
input[type=range]{width:100%;height:32px;accent-color:var(--accent);cursor:pointer}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:16px}
.result{background:var(--accent-soft);border-color:var(--accent);text-align:center}
.result small{display:block;color:var(--muted);font-size:16px}
.result .big{font-size:clamp(36px,10vw,56px);font-weight:800;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums;color:var(--accent)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 6px;background:var(--line)}
.split i{display:block;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<main>
  <div class="top">
    <small>Net worth</small>
    <h1>$1 Trillion</h1>
  </div>

  <div class="card">
    <div class="row"><label for="cash">Cash he holds</label><output id="cashOut"></output></div>
    <input id="cash" type="range" min="1" max="10" step="0.5" value="1">
    <div class="scale"><span>$1B</span><span>$10B</span></div>
    <div class="split"><i id="bar" style="width:0.1%"></i></div>
    <p class="hint" id="stockNote"></p>
  </div>

  <div class="card">
    <div class="row"><label for="surplus">Surplus per employee (lifetime)</label><output id="surOut"></output></div>
    <input id="surplus" type="range" min="100" max="10000" step="100" value="1000">
    <div class="scale"><span>$100</span><span>$10,000</span></div>
  </div>

  <div class="card result">
    <small>Employees needed to generate that cash</small>
    <div class="big" id="emp"></div>
    <small id="eq"></small>
  </div>
</main>
<script>
(function(){
  var cash=document.getElementById('cash'),sur=document.getElementById('surplus');
  var fmt=function(n){return n.toLocaleString('en-US')};
  function update(){
    var c=parseFloat(cash.value)*1e9, s=parseFloat(sur.value);
    var emp=Math.round(c/s);
    document.getElementById('cashOut').textContent='$'+parseFloat(cash.value)+'B';
    document.getElementById('surOut').textContent='$'+fmt(s);
    document.getElementById('emp').textContent=fmt(emp);
    document.getElementById('eq').textContent='$'+parseFloat(cash.value)+'B ÷ $'+fmt(s)+' per employee';
    var pct=c/1e12*100;
    document.getElementById('bar').style.width=pct+'%';
    document.getElementById('stockNote').textContent=pct.toFixed(1)+'% cash, '+(100-pct).toFixed(1)+'% stock ($'+(1000-parseFloat(cash.value)).toLocaleString('en-US',{maximumFractionDigits:1})+'B).';
  }
  cash.addEventListener('input',update);sur.addEventListener('input',update);update();
})();
</script>
</body>
</html>
