<style>
:root{--fm:13px;--bg:#0b0907;--bg2:#15110d;--ink:#f3ead9;--mut:#ab9f8b;--gold:#e0a63e;--line:#ffffff1f;--d:'Cormorant Garamond',Georgia,serif;--b:'Bricolage Grotesque',system-ui,sans-serif;color-scheme:dark}

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font:400 max(var(--fm),1.06rem)/1.6 var(--b);color:var(--ink);background:var(--bg);overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.sm{font-size:var(--fm);color:var(--mut)}
.btn{background:none;border:1px solid var(--line);padding:.6em 1.2em;border-radius:99px;cursor:pointer;font-size:var(--fm);transition:.25s}
.btn:hover,.btn:focus-visible{border-color:var(--gold);color:var(--gold)}
.btn.g{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.btn.g:hover{background:#f3c065;color:#1a1205}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* HOME */
.home{min-height:100vh;min-height:100svh;position:relative;display:grid;place-items:center;text-align:center;padding:12vh 6vw 8vh;overflow:hidden}
.fl{position:absolute;width:clamp(120px,19vw,300px);border-radius:3px;box-shadow:0 30px 60px #000a;opacity:.55;animation:fl 14s ease-in-out infinite alternate;transition:opacity 1s}
.fl img{display:block;width:100%;animation:fade 1.4s}
@keyframes fl{from{transform:translateY(-3vh) rotate(var(--r))}to{transform:translateY(4vh) rotate(calc(var(--r)*-1))}}
@keyframes fade{from{opacity:0}}
.hc{position:relative;z-index:2;max-width:900px}
.kick{font-size:var(--fm);letter-spacing:.35em;color:var(--gold)}
h1{font:500 clamp(3rem,10vw,8rem)/.95 var(--d);margin:.25em 0}
h1 span{display:inline-block;animation:up 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(60%) rotate(4deg)}}
.lead{font:italic 500 clamp(1.2rem,2.4vw,1.8rem)/1.3 var(--d);color:#d8ccb6;max-width:34ch;margin:0 auto 2.2rem}
.cta{position:relative;font:700 clamp(1rem,2.2vw,1.4rem) var(--b);letter-spacing:.14em;padding:1.3em 2.6em;border-radius:99px;border:0;background:var(--gold);color:#1a1205;cursor:pointer;animation:pulse 2.6s infinite;transition:transform .3s}
.cta:hover{transform:scale(1.06)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e0a63e88}100%{box-shadow:0 0 0 38px #e0a63e00}}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:1.1rem 0;white-space:nowrap}
.mq div{display:inline-block;animation:mq 40s linear infinite;font:italic 500 clamp(1.4rem,3vw,2.2rem) var(--d);color:var(--mut)}
.mq b{color:var(--gold);margin:0 1.2em;font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:clamp(3rem,9vw,7rem) 6vw;max-width:1300px;margin:auto}
h2{font:500 clamp(2rem,5vw,3.6rem)/1.05 var(--d);margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:clamp(1rem,2vw,1.8rem)}
.card{background:var(--bg2);border-radius:6px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px #000a}
.card .im{aspect-ratio:4/3;background-size:cover;background-position:center;transition:transform .8s}
.card:hover .im{transform:scale(1.07)}
.card .im.w{overflow:hidden}
.card .t{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.25rem}
.card h3{font:500 1.55rem/1.1 var(--d)}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chips span{border:1px solid var(--line);padding:.35em 1em;border-radius:99px;font-size:var(--fm);color:var(--mut)}
/* CHANNEL */
.hero{position:relative;height:100vh;height:100svh;overflow:hidden;background:#000;touch-action:pan-y}
.sl{position:absolute;inset:0;display:grid;place-items:center;animation:fade 1.2s both}
.sl.out{opacity:0;transition:opacity 1.2s}
.sl .bg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(50px) brightness(.5) saturate(1.3)}
.sl img{position:relative;max-width:88vw;max-height:86svh;max-height:86vh;box-shadow:0 40px 90px #000c;animation:kb 16s ease-out forwards;transform-origin:var(--o)}
@keyframes kb{from{transform:scale(.94)}to{transform:scale(1.04)}}
.hud{position:absolute;z-index:5;font-size:var(--fm);opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 1px 8px #000}
.ui .hud{opacity:1}
.hud.tl{top:max(1.2rem,env(safe-area-inset-top));left:1.5rem}
.hud.tl b{display:block;font:500 clamp(1.4rem,3vw,2rem)/1 var(--d)}
.hud.tr{top:max(1.2rem,env(safe-area-inset-top));right:1.5rem;display:flex;gap:.6rem;pointer-events:auto}
.hud.bl{bottom:2rem;left:1.5rem;max-width:60%}
.hud.br{bottom:2rem;right:1.5rem;text-align:right}
.cap{position:absolute;z-index:4;left:1.5rem;bottom:2rem;font:italic 500 clamp(1.1rem,2vw,1.5rem) var(--d);animation:up .9s .4s both;text-shadow:0 1px 10px #000}
.ui .cap{opacity:0}
.pb{position:absolute;z-index:6;left:0;right:0;bottom:0;height:3px;background:#ffffff18}
.pb i{display:block;height:100%;width:0;background:var(--gold)}
.pb.s{bottom:3px;height:2px}.pb.s i{background:#fff6}
.hint{position:absolute;z-index:5;left:50%;bottom:1.2rem;transform:translateX(-50%);font-size:var(--fm);color:var(--mut);white-space:nowrap;animation:hint 7s 1.5s both;pointer-events:none}
@keyframes hint{0%,90%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
.cue{position:absolute;z-index:5;left:50%;bottom:3.2rem;transform:translateX(-50%);font-size:var(--fm);animation:bob 2s infinite;opacity:0;transition:.6s}
.ui .cue{opacity:.8}
@keyframes bob{50%{transform:translate(-50%,8px)}}
.ch{max-width:1200px;margin:auto;padding:0 6vw}
.intro{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;padding:clamp(3rem,8vw,6rem) 0}
@media(min-width:800px){.intro{grid-template-columns:320px 1fr;gap:4rem}}
.pf{width:100%;max-width:320px;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 10px #ffffff0d}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-top:1.5rem}
.facts div{border-left:2px solid var(--gold);padding-left:.8rem}
.facts b{display:block;font:500 1.6rem/1.1 var(--d)}
.wk{background:var(--bg2);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.wk img{width:100%;aspect-ratio:1;object-fit:cover;transition:transform .7s}
.wk:hover img{transform:scale(1.06)}
.wk .im{overflow:hidden}
.wk .t{padding:1rem;display:flex;flex-direction:column;gap:.2rem;flex:1}
.wk h3{font:500 1.4rem/1.1 var(--d)}
.wk .r{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:.8rem}
.pill{color:#8fd19e}.pill.s{color:#e07a6a}
.bars{display:flex;gap:1rem;align-items:flex-end;height:160px;margin-top:1rem}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.4rem;height:100%}
.bars i{width:100%;max-width:70px;background:linear-gradient(var(--gold),#7a5416);border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
form{display:grid;gap:1rem;max-width:640px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
label{display:grid;gap:.3rem;font-size:var(--fm);color:var(--mut)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:.7em .9em;font-size:max(16px,var(--fm));color:var(--ink);width:100%}
dialog{margin:auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:1.6rem;width:min(92vw,520px)}
dialog::backdrop{background:#000b;backdrop-filter:blur(6px)}
dialog[open]{animation:up .4s both}
.toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:var(--gold);color:#1a1205;padding:.8em 1.4em;border-radius:99px;font-size:var(--fm);z-index:99;animation:up .4s both}
.cv{position:fixed;inset:0;background:var(--bg);z-index:50;pointer-events:none;opacity:0;transition:opacity .7s}
.cv.on{opacity:1}
footer{padding:3rem 6vw;text-align:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* ---------- sample data (placeholder artists, not real people) ---------- */
const R=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const H=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);

const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const ARTISTS=[
 {slug:'subir-biswas',name:'Subir Biswas',craft:'Terracotta',loc:'Bishnupur, West Bengal',yrs:28,k:['vase','mandala'],p:['#b5532b','#e8a66b','#3b1a0e','#1d0f09'],bio:'Third-generation terracotta modeller shaping temple-tile motifs into contemporary vessels and wall reliefs.',aw:['State Craft Award, 2014','Master Artisan, 2019'],t:'Rasa Vessel|Temple Tile Study|Sandhya Jar|Horse of Bankura|Panchali|Earth Mandala|Monsoon Urn|Kalash Nocturne'},
 {slug:'mala-chitrakar',name:'Mala Chitrakar',craft:'Pattachitra',loc:'Naya, Medinipur',yrs:22,k:['mandala','land'],p:['#d94f30','#f2c14e','#1f6f78','#17120d'],bio:'Scroll painter and singer. Her patas narrate river legends in natural mineral pigments.',aw:['Kala Ratna, 2017'],t:'Manasa Scroll|Fish Eye|River Song|Durga Descends|Sun Over Ganga|Lotus Wheel|Vana Parva|Dusk Procession'},
 {slug:'rekha-mondal',name:'Rekha Mondal',craft:'Kantha Textile',loc:'Birbhum',yrs:19,k:['wave','mandala'],p:['#2e7d9a','#f4d58d','#c8553d','#0f1a22'],bio:'Leads a twelve-woman collective stitching layered kantha storytelling quilts.',aw:['Handloom Excellence, 2020'],t:'Running Stitch Sea|Tree of Seasons|Courtyard|Ma\'s Quilt|Paddy Ripples|Night Loom|Kantha Moon|Ghat Morning'},
 {slug:'gopal-karmakar',name:'Gopal Karmakar',craft:'Dokra Metal Casting',loc:'Bankura',yrs:31,k:['spiral','vase'],p:['#c98a2b','#f0cf7a','#6b3d12','#120d07'],bio:'Lost-wax caster of Dokra figures, working beeswax threads into brass tribal forms.',aw:['National Merit Award, 2011','UNESCO Seal, 2016'],t:'Wax Thread Spiral|Tribal Drummer|Nandi|Coiled Light|Brass Tree|Lakshmi Lamp|Hunter|Gold Whorl'},
 {slug:'anirban-paul',name:'Anirban Paul',craft:'Oil Painting',loc:'Kolkata',yrs:15,k:['land','wave'],p:['#3f5fa8','#f1a65a','#7a2e4d','#0e1020'],bio:'Paints Kolkata skies and river edges in layered, luminous oils.',aw:['Emerging Artist Prize, 2021'],t:'Hooghly at Dusk|Tram Lines|Monsoon Terrace|Blue Hour|College Street|Ferry|Ochre Sky|Last Light'},
 {slug:'nitai-pal',name:'Nitai Pal',craft:'Idol Sculpture',loc:'Kumortuli, Kolkata',yrs:34,k:['mandala','spiral'],p:['#8e3a59','#f6d365','#2a6f5b','#150c10'],bio:'Clay idol maker from the Kumortuli lanes, carrying a four-generation lineage.',aw:['Banga Shilpi, 2012'],t:'Chalchitra|Eyes of Durga|Clay Dawn|Ten Arms|Bodhon|Lion Study|Mahalaya|Visarjan'}
];
function svg(kind,seed,p,port){
 const r=R(seed),W=port?600:800,Hh=port?800:600,cx=W/2,cy=Hh/2,m=Math.min(W,Hh);
 let s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${Hh}'><rect width='${W}' height='${Hh}' fill='${p[3]}'/>`;
 if(kind=='mandala'){
  s+=`<rect x='14' y='14' width='${W-28}' height='${Hh-28}' fill='none' stroke='${p[1]}' stroke-width='3'/>`;
  for(let k=0;k<9;k++){const rad=m*.46-k*m*.048;s+=`<circle cx='${cx}' cy='${cy}' r='${rad}' fill='${p[k%3]}' opacity='${.9-k*.05}'/>`;
   const n=6+k*3;for(let j=0;j<n;j++){const a=j/n*6.283+k;s+=`<circle cx='${cx+Math.cos(a)*rad}' cy='${cy+Math.sin(a)*rad}' r='${m*.018+r()*6}' fill='${p[(k+1)%3]}'/>`}}
  s+=`<circle cx='${cx}' cy='${cy}' r='${m*.04}' fill='${p[3]}'/>`;
 }else if(kind=='vase'){
  const pts=[],N=26,vh=Hh*.78,top=Hh*.11,bw=m*.3;
  for(let i=0;i<=N;i++){const t=i/N,w=bw*(.4+.6*Math.sin(Math.PI*Math.pow(t,.8))+(i<3?.1:0))+r()*3;pts.push([w,top+t*vh])}
  const d='M'+pts.map(q=>`${cx-q[0]},${q[1]}`).join(' L')+' L'+pts.reverse().map(q=>`${cx+q[0]},${q[1]}`).join(' L')+'Z';
  s+=`<defs><clipPath id='c'><path d='${d}'/></clipPath></defs><circle cx='${cx}' cy='${cy}' r='${m*.45}' fill='${p[2]}' opacity='.35'/><path d='${d}' fill='${p[0]}'/><g clip-path='url(#c)'>`;
  for(let i=0;i<9;i++){const y=top+vh*(.1+i*.1);s+=i%2?`<rect x='0' y='${y}' width='${W}' height='${6+r()*10}' fill='${p[1]}'/>`:`<path d='M0 ${y} `+Array.from({length:14},(_,j)=>`L${j*W/13} ${y+(j%2?16:-16)}`).join(' ')+`' fill='none' stroke='${p[2]}' stroke-width='6'/>`}
  s+=`</g><ellipse cx='${cx}' cy='${top}' rx='${pts[pts.length-1][0]}' ry='10' fill='${p[3]}'/>`;
 }else if(kind=='wave'){
  for(let i=0;i<26;i++){const y=i*Hh/25,a=10+r()*28,f=r()*3+1;
   let d=`M0 ${y}`;for(let x=0;x<=W;x+=40)d+=` L${x} ${y+Math.sin(x/W*6.28*f+i)*a}`;
   s+=`<path d='${d}' fill='none' stroke='${p[i%3]}' stroke-width='5' stroke-dasharray='14 9' stroke-linecap='round'/>`}
 }else if(kind=='spiral'){
  for(let j=0;j<3;j++){let d='',ox=cx+(j-1)*m*.2*(j?1:0),oy=cy+(j-1)*m*.15*(j?1:0);
   for(let a=0;a<44;a+=.2){const q=a*(m*.0105)+(j?0:0);d+=(a?'L':'M')+(ox+Math.cos(a+j)*q+r()*2)+' '+(oy+Math.sin(a+j)*q+r()*2)}
   s+=`<path d='${d}' fill='none' stroke='${p[j%2]}' stroke-width='${7-j*1.5}' stroke-linecap='round' opacity='${1-j*.25}'/>`}
  for(let i=0;i<40;i++)s+=`<circle cx='${r()*W}' cy='${r()*Hh}' r='${2+r()*4}' fill='${p[1]}' opacity='.6'/>`;
 }else{
  s+=`<defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${p[2]}'/><stop offset='1' stop-color='${p[1]}'/></linearGradient></defs><rect width='${W}' height='${Hh}' fill='url(#g)'/><circle cx='${W*(.3+r()*.4)}' cy='${Hh*.38}' r='${m*.14}' fill='${p[3]}' opacity='.9'/>`;
  for(let l=0;l<5;l++){const y=Hh*(.5+l*.1);let d=`M0 ${Hh} L0 ${y}`;for(let x=0;x<=W;x+=50)d+=` L${x} ${y-20+r()*50*(1+l*.2)}`;
   s+=`<path d='${d} L${W} ${Hh}Z' fill='${p[l%2?0:3]}' opacity='${.35+l*.15}'/>`}
 }
 return 'data:image/svg+xml;utf8,'+encodeURIComponent(s+'</svg>');
}
ARTISTS.forEach(a=>{const r=R(H(a.slug));a.works=a.t.split('|').map((t,i)=>{const kind=a.k[i%2],port=i%3==1,sold=i%4==3;
 return{id:a.slug+'-'+(i+1),title:t,medium:a.craft,kind,port,src:svg(kind,H(a.slug)+i*17,a.p,port),dim:`${30+Math.round(r()*9)*5} × ${25+Math.round(r()*9)*5} cm`,yr:2019+Math.round(r()*7),price:sold?null:Math.round((6+r()*90)*500/100)*100,avail:sold?'Sold':'Available'}});a.pf=svg('mandala',H(a.slug)+3,a.p,false)});
const A=Object.fromEntries(ARTISTS.map(a=>[a.slug,a]));
/* ---------- rotation engine: exposure-aware weighted random ---------- */
const SLOT=(+new URLSearchParams(location.search).get('slot')||600)*1000, ART_MS=8000;
/* ---------- mock API: replace each method body with a fetch() to your backend ---------- */
let RT=0;
const TOTAL=Math.max(3,+new URLSearchParams(location.search).get('artists')||100000);
const LAT=()=>new Promise(r=>setTimeout(r,60+Math.random()*140));
const FN='Arun Bipasha Chandan Dipa Esha Farid Gita Hari Indu Jayanta Kavita Lalan Mithu Nandini Omar Pritha Rana Sunil Tapan Uma Vikram Sumana Tarun Ratna'.split(' '),LN='Biswas Chitrakar Mondal Karmakar Paul Pal Das Sen Ghosh Roy Dey Bose Sarkar Maity Patra Rana'.split(' ');
const CR=[['Terracotta',['vase','mandala']],['Pattachitra',['mandala','land']],['Kantha Textile',['wave','mandala']],['Dokra Metal Casting',['spiral','vase']],['Oil Painting',['land','wave']],['Idol Sculpture',['mandala','spiral']],['Wood Carving',['vase','wave']],['Pottery',['vase','land']]];
const LC=['Bishnupur','Bankura','Kolkata','Birbhum','Medinipur','Kumortuli','Murshidabad','Krishnanagar'];
const TW1='River Dusk Clay Monsoon Lotus Temple Golden Silent Courtyard Ember Harvest Moon'.split(' '),TW2='Study Song Vessel Procession Whorl Garden Offering Memory Dance Light'.split(' ');
const PAL=[...ARTISTS.map(a=>a.p),['#4c7a4e','#e9d985','#8a3b2c','#0d140e'],['#6a4c93','#ffca7a','#2b7a78','#120d1a']];
const SRV={exp:store.get('pag-exp',{}),day:store.get('pag-day',{})};/* stands in for Redis / Postgres */
/* deterministic virtual catalogue: artist i exists without being stored */
function meta(i){
 if(i<ARTISTS.length)return ARTISTS[i];
 const r=R(i*7919+13),c=CR[Math.floor(r()*CR.length)],pk=l=>l[Math.floor(r()*l.length)],loc=pk(LC)+', West Bengal';
 return{slug:'artist-'+i,name:pk(FN)+' '+pk(LN),craft:c[0],loc,yrs:5+Math.floor(r()*35),k:c[1],p:pk(PAL),bio:`${c[0]} artist from ${loc}. Sample profile generated for scale testing.`,aw:[],n:6+Math.floor(r()*30)}
}
function find(slug){const i=A[slug]?ARTISTS.indexOf(A[slug]):+((/^artist-(\d+)$/.exec(slug)||[])[1]??-1);return i>=0&&i<TOTAL?meta(i):null}
function work(a,j){const r=R(H(a.slug)+j*31),port=j%3==1,sold=j%4==3;
 return{id:a.slug+'-'+(j+1),title:TW1[Math.floor(r()*TW1.length)]+' '+TW2[Math.floor(r()*TW2.length)],medium:a.craft,kind:a.k[j%2],port,src:svg(a.k[j%2],H(a.slug)+j*17,a.p,port),dim:`${30+Math.round(r()*9)*5} × ${25+Math.round(r()*9)*5} cm`,yr:2019+Math.round(r()*7),price:sold?null:Math.round((6+r()*90)*5)*100,avail:sold?'Sold':'Available'}}
const total=a=>a.works?a.works.length:a.n;
const slice=(a,c,l)=>a.works?a.works.slice(c,c+l):Array.from({length:Math.max(0,Math.min(l,a.n-c))},(_,k)=>work(a,c+k));
function history(slug){const ex=SRV.day[slug]||{};return[2,1,0].map(n=>{const d=new Date(Date.now()-n*864e5),k=d.toDateString(),r=R(H(slug)+n);return{l:n?d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'Today',v:n?40+Math.round(r()*120):(ex[k]||0)+Math.round(r()*30)}})}
const API={
 /* GET /api/artists?page&limit&q — paginated; search must hit an index (Postgres FTS / Meilisearch), never a scan */
 async listArtists({page=0,limit=12,q=''}={}){await LAT();q=q.trim().toLowerCase();const from=page*limit;let sel,more;
  if(q){const ids=[],need=from+limit+1;for(let i=0;i<TOTAL&&ids.length<need;i++){const m=meta(i);if((m.name+' '+m.craft+' '+m.loc).toLowerCase().includes(q))ids.push(i)}sel=ids.slice(from,from+limit);more=ids.length>from+limit}
  else{sel=Array.from({length:Math.max(0,Math.min(limit,TOTAL-from))},(_,k)=>from+k);more=from+limit<TOTAL}
  return{items:sel.map(i=>{const m=meta(i);return{slug:m.slug,name:m.name,craft:m.craft,loc:m.loc,cover:m.works?m.works[0].src:work(m,0).src}}),hasMore:more}},
 /* GET /api/artist/:slug — profile plus first page of works only */
 async getArtist(slug){await LAT();const m=find(slug);if(!m)return null;return{...m,works:slice(m,0,12),total:total(m),pf:m.pf||svg('mandala',H(m.slug)+3,m.p,false),days:history(m.slug)}},
 /* GET /api/artist/:slug/works?cursor&limit */
 async getWorks(slug,{cursor=0,limit=12}={}){await LAT();const m=find(slug);return m?slice(m,cursor,limit):[]},
 /* GET /api/next-artist — server picks: sample a candidate pool, weight by 1/(1+impressions) */
 async nextArtist({exclude,recent=[]}={}){await LAT();const seen=new Set([exclude,...recent.slice(-Math.min(3,TOTAL-2))]),size=Math.min(24,TOTAL-seen.size),c=[];
  while(c.length<size){const m=meta(Math.floor(Math.random()*TOTAL));if(!seen.has(m.slug)&&!c.some(x=>x.slug==m.slug))c.push(m)}
  const w=c.map(m=>1/(1+(SRV.exp[m.slug]||0)));let x=Math.random()*w.reduce((p,q)=>p+q,0);
  const m=c.find((_,k)=>(x-=w[k])<=0)||c[0];return API.getArtist(m.slug)},
 /* POST /api/impressions — batch these in production */
 impression(slug){SRV.exp[slug]=(SRV.exp[slug]||0)+1;store.set('pag-exp',SRV.exp);const k=new Date().toDateString();(SRV.day[slug]=SRV.day[slug]||{})[k]=(SRV.day[slug][k]||0)+1;store.set('pag-day',SRV.day)}
};
function record(slug){API.impression(slug);const r=store.get('pag-rec',[]);r.push(slug);store.set('pag-rec',r.slice(-20))}
const cardHTML=a=>`<a class="card" href="#/artist/${a.slug}"><div class="im w"><div class="im" style="background-image:url(&quot;${a.cover}&quot;)"></div></div><div class="t"><h3>${a.name}</h3><span class="sm">${a.craft} · ${a.loc}</span></div></a>`;
const wkHTML=(w,j)=>`<article class="wk"><div class="im"><img loading="lazy" alt="${w.title}" src="${w.src}"></div><div class="t"><h3>${w.title}</h3><span class="sm">${w.medium} · ${w.dim} · ${w.yr}</span><div class="r"><span>${w.price?fmt(w.price):'—'} <span class="sm pill ${w.price?'':'s'}">${w.avail}</span></span>${w.price?`<button class="btn" data-enq="${j}">Enquire</button>`:''}</div></div></article>`;
function dirInit(){let page=0,q='',busy=0,db;const g=$('#dir'),more=$('#more'),st=$('#dst');
 const load=async reset=>{if(busy)return;busy=1;if(reset){page=0;g.innerHTML=''}more.disabled=true;
  try{const r=await API.listArtists({page,limit:12,q});if(!g.isConnected)return;g.insertAdjacentHTML('beforeend',r.items.map(cardHTML).join(''));
   st.textContent=q?`${g.children.length} shown`:`${g.children.length} of ${TOTAL.toLocaleString('en-IN')} artists`;more.hidden=!r.hasMore;page++}catch{st.textContent='Could not load artists. Try again.'}
  more.disabled=false;busy=0};
 $('#q').oninput=e=>{clearTimeout(db);db=setTimeout(()=>{q=e.target.value;load(true)},300)};
 more.onclick=()=>load();new IntersectionObserver(e=>{if(e[0].isIntersecting&&!more.hidden)load()},{rootMargin:'400px'}).observe(more);load(true)}
async function loadWorks(b){if(!G)return;const g=G;b.disabled=true;const r=await API.getWorks(g.a.slug,{cursor:g.a.works.length,limit:12});if(G!==g)return;const s=g.a.works.length;g.a.works.push(...r);
 $('#wg').insertAdjacentHTML('beforeend',r.map((w,k)=>wkHTML(w,s+k)).join(''));g.a.works.length>=g.a.total?b.remove():b.disabled=false}
async function openArtist(slug,t){$('#cv').classList.add('on');try{const a=await API.getArtist(slug);if(t!=RT)return;a?mount(a,'channel'):(location.hash='#/')}catch{if(t==RT){$('#cv').classList.remove('on');toast('Could not load this artist')}}}
/* ---------- views ---------- */
const app=$('#app');let G=null,tick=null,uiT=null;
const fmt=n=>'₹'+n.toLocaleString('en-IN');
function stop(){clearInterval(tick);tick=null;G=null}
function route(){
 stop();const h=location.hash.slice(1)||'/';const m=h.match(/^\/artist\/(.+)/),t=++RT;
 scrollTo(0,0);
 if(h=='/gallery')startGallery(t);else if(m)openArtist(m[1],t);else home();
}
function home(){
 const all=ARTISTS.flatMap(a=>a.works),r=R(Date.now()%1000);
 const pos=[[3,8,-4],[70,6,5],[8,58,4],[74,54,-5],[40,70,3]];
 const names=ARTISTS.map(a=>`${a.name}<b>◆</b>${a.craft}<b>◆</b>`).join('');
 app.innerHTML=`<section class="home">${pos.map((p,i)=>`<div class="fl" style="left:${p[0]}%;top:${p[1]}%;--r:${p[2]}deg;animation-delay:-${i*3}s"><img data-fl alt=""></div>`).join('')}
 <div class="hc"><p class="kick">DISCOVER • APPRECIATE • COLLECT</p>
 <h1>${[...'Art without boundaries.'].map((c,i)=>`<span style="--i:${i}">${c==' '?'&nbsp;':c}</span>`).join('')}</h1>
 <p class="lead">An endless exhibition of extraordinary artists and their creations.</p>
 <button class="cta" data-go="#/gallery">ENTER THE GALLERY</button>
 <p class="sm" style="margin-top:1.4rem">A new artist every ${Math.round(SLOT/60000)} minutes. Endless discovery.</p></div></section>
 <div class="mq"><div>${names+names}${names+names}</div></div>
 <section class="sec"><h2>Artists in the rotation</h2><label style="max-width:420px;margin-bottom:1.5rem">Search by name, craft or place<input id="q" type="search"></label><div class="grid" id="dir"></div><p class="sm" id="dst" style="margin-top:1.2rem"></p><p><button class="btn" id="more" hidden>Load more artists</button></p></section>
 <section class="sec"><h2>Browse by medium</h2><div class="chips">${['Paintings','Sculptures','Terracotta','Pottery','Textile art','Metal craft','Folk art','Woodwork'].map(x=>`<span>${x}</span>`).join('')}</div>
 <p style="margin-top:2.5rem"><button class="btn" data-join>Join as an artist</button></p></section>
 <footer class="sm">Prototype with sample artists and generated artwork. Replace with real photographs.</footer>`;
 dirInit();const fl=[...app.querySelectorAll('[data-fl]')];const set=()=>fl.forEach(i=>{const w=all[Math.floor(Math.random()*all.length)];i.src=w.src});set();
 const iv=setInterval(()=>{if(!$('.home')){clearInterval(iv);return}const i=fl[Math.floor(Math.random()*fl.length)];i.src=all[Math.floor(Math.random()*all.length)].src},2800);
}
async function startGallery(t){
 $('#cv').classList.add('on');
 try{const s=store.get('pag-sess',null);let a,o={};
  if(s&&Date.now()-s.ts<1800000){a=await API.getArtist(s.slug);o={tS:s.tSlot,i:s.i}}
  if(!a)a=await API.nextArtist({recent:store.get('pag-rec',[])});
  if(t==RT)mount(a,'gallery',o)}
 catch{if(t==RT){$('#cv').classList.remove('on');toast('Gallery unavailable. Retrying…');setTimeout(()=>t==RT&&startGallery(t),4000)}}
}
function mount(a,mode,o={}){
 const cv=$('#cv');cv.classList.add('on');
 const t=RT;setTimeout(()=>{if(t!=RT){cv.classList.remove('on');return}stop();if(mode=='gallery')record(a.slug);
  G={a,mode,i:o.i||0,paused:false,tA:0,tS:o.tS||0,last:performance.now()};
  const days=a.days,mx=Math.max(...days.map(d=>d.v));
  app.innerHTML=`<section class="hero" id="hero"><div id="stage"></div>
  <div class="hud tl"><b>${a.name}</b>${a.craft} · ${a.loc}</div>
  <div class="hud tr">${mode=='gallery'?'':'<a class="btn" href="#/gallery">Gallery</a>'}<button class="btn" data-go="#/" aria-label="Exit">Esc</button></div>
  <div class="hud br" id="nx"></div>
  <div class="hint">← → artworks · space pause · N next artist · ↓ profile · F fullscreen</div>
  <div class="cue">↓</div><div class="pb s"><i id="ps"></i></div><div class="pb"><i id="pa"></i></div></section>
  <main class="ch" id="profile">
  <div class="intro"><img class="pf" alt="${a.name}" src="${a.pf}"><div><h2>${a.name}</h2><p class="sm">${a.craft} · ${a.loc}</p><p style="margin-top:1rem;max-width:56ch">${a.bio}</p>
  <div class="facts"><div><b>${a.yrs} years</b><span class="sm">Experience</span></div><div><b>${a.total}</b><span class="sm">Artworks</span></div>${a.aw.map(x=>`<div><b>★</b><span class="sm">${x}</span></div>`).join('')}</div>
  <p style="margin-top:1.5rem"><button class="btn g" data-enq="-1">Contact the artist</button></p></div></div>
  <h2>Collection</h2><div class="grid" id="wg">${a.works.map(wkHTML).join('')}</div>${a.total>a.works.length?'<p style="margin-top:1.5rem"><button class="btn" id="wm">Load more works</button></p>':''}
  <div class="intro" style="padding-bottom:0"><div><h2>Studio and workshop</h2><p class="sm">${a.loc}</p><p style="margin-top:1rem">Studio photographs, process films and tools will appear here once the artist uploads them.</p></div>
  <div><h2>Exhibition history</h2><p class="sm">Impressions per day (sample data)</p><div class="bars">${days.map(d=>`<div><span class="sm">${d.v}</span><i style="height:${Math.max(8,d.v/mx*100)}%"></i><span class="sm">${d.l}</span></div>`).join('')}</div></div></div>
  <section class="sec" style="padding-inline:0"><h2>Commission a work</h2><form data-com>
  <div class="two"><label>Type of artwork<input required name="t" placeholder="Wall relief, scroll, idol…"></label><label>Preferred medium<input name="m" value="${a.craft}"></label></div>
  <div class="two"><label>Approx. dimensions<input name="d" placeholder="60 × 40 cm"></label><label>Budget (₹)<input name="b" inputmode="numeric"></label></div>
  <div class="two"><label>Deadline<input type="date" name="dl"></label><label>Your email or phone<input required name="c"></label></div>
  <label>Requirements<textarea rows="4" name="n"></textarea></label><button class="btn g" style="justify-self:start">Send commission request</button></form></section>
  <section class="sec" style="padding-inline:0;padding-top:0"><h2>Authenticity</h2><p style="max-width:60ch">Certificates and provenance are supplied by the artist. Platform approval does not guarantee authenticity.</p></section></main>
  <footer class="sm">Artworks remain on this channel after the exhibition slot ends. <a href="#/">Home</a></footer>`;
  cv.classList.remove('on');showSlide(true);ui();
  const hero=$('#hero');let tx=0;hero.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
  hero.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)step(d<0?1:-1);else ui()});
  tick=setInterval(loop,100);
 },mode=='x'?0:600);
}
function showSlide(first){
 const w=G.a.works[G.i],st=$('#stage');if(!st)return;
 st.querySelectorAll('.sl').forEach(e=>{e.classList.add('out');setTimeout(()=>e.remove(),1300)});
 st.querySelectorAll('.cap').forEach(e=>e.remove());
 const d=document.createElement('div');d.className='sl';d.innerHTML=`<div class="bg" style="background-image:url(&quot;${w.src}&quot;)"></div><img alt="${w.title}, ${w.medium}" src="${w.src}" style="--o:${30+Math.random()*40}% ${30+Math.random()*40}%">`;
 const c=document.createElement('div');c.className='cap';c.textContent=w.title;st.append(d,c);
 const n=G.a.works[(G.i+1)%G.a.works.length];new Image().src=n.src;
}
function step(dir){if(!G)return;const n=G.a.works.length;G.i=(G.i+dir+n)%n;G.tA=0;showSlide()}
async function nextArtist(){if(!G||G.busy)return;const g=G;g.busy=1;
 try{const a=await API.nextArtist({exclude:g.a.slug,recent:store.get('pag-rec',[])});if(G!==g)return;
  if(g.mode=='gallery'){store.set('pag-sess',{slug:a.slug,i:0,tSlot:0,ts:Date.now()});mount(a,'gallery')}}
 catch{g.busy=0;g.tS=Math.max(0,SLOT-5000)}}
function loop(){if(!G)return;const n=performance.now(),d=n-G.last;G.last=n;if(G.paused||document.hidden)return;
 G.tA+=d;G.tS+=d;const pa=$('#pa'),ps=$('#ps'),nx=$('#nx');
 if(pa)pa.style.width=G.tA/ART_MS*100+'%';
 if(G.mode=='gallery'){if(ps)ps.style.width=G.tS/SLOT*100+'%';const left=Math.max(0,Math.ceil((SLOT-G.tS)/1000));if(nx)nx.textContent='Next artist in '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(Math.round(G.tS/100)%20==0)store.set('pag-sess',{slug:G.a.slug,i:G.i,tSlot:G.tS,ts:Date.now()});
  if(G.tS>=SLOT)return nextArtist()}
 if(G.tA>=ART_MS)step(1);
}
function ui(){document.body.classList.add('ui');clearTimeout(uiT);uiT=setTimeout(()=>document.body.classList.remove('ui'),3000)}
/* ---------- dialogs ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function form(title,sub,fields,done){
 const d=$('#dlg');d.innerHTML=`<h2 style="font-size:2rem">${title}</h2><p class="sm" style="margin-bottom:1rem">${sub}</p><form method="dialog" style="gap:.8rem">${fields.map(f=>`<label>${f[0]}${f[2]?`<textarea rows="3" name="${f[1]}"></textarea>`:`<input name="${f[1]}" ${f[1]=='c'?'required':''}>`}</label>`).join('')}
 <div style="display:flex;gap:.6rem"><button class="btn g" value="ok">Send</button><button class="btn" value="x" formnovalidate>Cancel</button></div></form>`;
 d.showModal();d.onclose=()=>{if(d.returnValue=='ok')toast(done)};
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const q=e.target.closest('[data-enq]');if(q&&G){const w=G.a.works[+q.dataset.enq];
  form(w?`Enquire: ${w.title}`:`Contact ${G.a.name}`,`${G.a.name} replies directly. The platform does not process payment in this version.`,[['Your name','n'],['Email or phone','c'],['Message','m',1]],'Enquiry sent to the artist (demo)');return}
 if(e.target.id=='wm')loadWorks(e.target);
 if(e.target.closest('[data-join]'))form('Join as an artist','Tell us about your craft. We review every application.',[['Name','n'],['Email or phone','c'],['Art form and location','a',1]],'Application received (demo)');
});
document.addEventListener('submit',e=>{if(e.target.matches('[data-com]')){e.preventDefault();e.target.reset();toast('Commission request sent (demo)')}});
document.addEventListener('mousemove',()=>{if($('#hero'))ui()});
document.addEventListener('keydown',e=>{
 if($('#dlg').open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 const k=e.key;
 if(k=='Escape'&&location.hash!='#/'&&location.hash!=''){if(document.fullscreenElement)return;location.hash='#/';return}
 if(!G)return;
 if(k=='ArrowRight'){step(1);ui()}else if(k=='ArrowLeft'){step(-1);ui()}
 else if(k==' '&&scrollY<innerHeight/2){e.preventDefault();G.paused=!G.paused;ui();toast(G.paused?'Paused':'Playing')}
 else if(k=='n'||k=='N'){G.mode=='gallery'?nextArtist():location.hash='#/gallery'}
 else if(k=='ArrowDown'&&scrollY<innerHeight/2){e.preventDefault();$('#profile').scrollIntoView()}
 else if(k=='ArrowUp'&&scrollY<innerHeight*1.5&&scrollY>0){e.preventDefault();scrollTo(0,0)}
 else if(k=='f'||k=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
});
addEventListener('hashchange',route);route();
</script>
</body>
