<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag Arena – Last Flag Standing</title>
<style>
:root{color-scheme:dark;--bg:#080c1c;--ink:#f4f6ff;--mut:#9aa6cf;--acc:#ffcc33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:10px}
h1{margin:0;font-size:24px;letter-spacing:.12em;font-weight:900;background:linear-gradient(90deg,#ffcc33,#ff4d6d,#6ea8ff,#ffcc33);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
#info{font-weight:700;color:var(--mut);background:rgba(0,0,0,.35);padding:4px 12px;border-radius:99px}
#feed{position:absolute;top:56px;left:14px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:calc(100% - 200px)}
#feed div{background:rgba(0,0,0,.5);padding:3px 12px;border-radius:8px;font-size:16px;animation:fi .3s,fo .5s 4.6s forwards}
@keyframes fi{from{transform:translateX(-30px);opacity:0}}
@keyframes fo{to{opacity:0}}
#banner{position:absolute;left:0;right:0;top:11%;text-align:center;pointer-events:none;display:none}
#banner.on{display:block;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.tr{font-size:clamp(40px,9vw,90px);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.wn{font-size:clamp(28px,7.5vw,80px);font-weight:900;background:linear-gradient(90deg,#ffcc33,#ff4d6d,#6ea8ff,#7dffb3,#ffcc33);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2s linear infinite;filter:drop-shadow(0 4px 14px #000)}
#bar{background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.12);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:160px;font:inherit;font-size:16px;padding:10px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:#10162f;color:var(--ink);outline:0}
input[type=text]:focus{border-color:var(--acc)}
input.bad{animation:shk .35s;border-color:#ff4d6d}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button{font:inherit;font-size:16px;font-weight:700;padding:10px 16px;border-radius:10px;border:0;cursor:pointer;background:#2a3566;color:var(--ink)}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.45;cursor:default}
.pri{background:linear-gradient(135deg,#ff4d6d,#ffa733);color:#190808;animation:pul 1.6s ease-in-out infinite}
.pri:disabled{animation:none}
@keyframes pul{50%{box-shadow:0 0 22px #ff7a4d}}
#msg{flex:1;color:var(--mut);min-width:140px}
#msg.bad{color:#ff8fa3}
label{display:flex;gap:6px;align-items:center;color:var(--mut);cursor:pointer}
#q{display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-height:84px;overflow:auto}
.chip{background:#1b2350;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:2px 6px 2px 12px;font-size:16px;display:inline-flex;gap:6px;align-items:center;animation:fi .25s}
.chip.nx{border-color:var(--acc);background:#3a2f10}
.chip b{cursor:pointer;color:var(--mut);padding:0 4px;font-weight:700}
.chip b:hover{color:#fff}
.dim{color:var(--mut)}
#lb{position:absolute;top:56px;right:14px;width:210px;max-height:calc(100% - 70px);overflow:hidden;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;font-size:16px}
.lh{font-weight:800;color:var(--acc);margin-bottom:4px}
.lr.nw{border-radius:6px;animation:glw 1.1s ease-in-out infinite alternate}
@keyframes glw{to{background:rgba(255,204,51,.28)}}
.lr{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;padding:0;line-height:1.25}
.lr span{color:var(--mut);width:2ch;text-align:right}
.lr img{width:24px;height:16px;border-radius:2px}
.lr em{font-style:normal;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr b{color:var(--acc)}
.cd{flex-basis:100%;font-size:inherit;color:#ffb36b;padding-left:32px;white-space:nowrap}
.cd.hot{color:#ff6b6b;font-weight:700;animation:glw .6s ease-in-out infinite alternate}
#lb a{display:block;text-align:right;color:var(--mut);cursor:pointer;text-decoration:underline;margin-top:2px}
@media (max-width:767px){html,body{font-size:14px}h1{font-size:16px}#info,#feed div,.chip,#msg,label,#lb{font-size:14px}#lb{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:none;font-size:13px}#lb .lg{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}}
#bar{display:none!important}
#feed{z-index:6}
#tk{flex:none;overflow:hidden;background:rgba(255,77,109,.14);border-bottom:1px solid rgba(255,255,255,.12);padding:5px 0;font-size:16px}
#tkt{display:flex;width:max-content;animation:tkm 30s linear infinite}
#tk:hover #tkt{animation-play-state:paused}
@keyframes tkm{to{transform:translateX(-50%)}}
.tkc{display:flex;align-items:center;gap:36px;padding-right:36px;min-width:100vw;white-space:nowrap}
.ti{display:inline-flex;align-items:center;gap:8px}
.ti img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid #fff}
.ti b{color:var(--acc)}
.tl{font-weight:800;color:#ff8fa3}
#pk{position:absolute;left:0;display:none;flex-direction:column;z-index:4;background:rgba(6,9,22,.92)}
#pkh{flex:none;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 14px;overflow:hidden}
#pkst{font-weight:800;color:var(--acc);font-size:16px}
#pkt{display:flex;gap:8px;align-items:center}
.tk{display:inline-flex;align-items:center;gap:6px;background:#1b2350;border:1px solid var(--acc);border-radius:99px;padding:3px 12px 3px 3px;font-size:16px;animation:fi .25s}
.tk img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.tk.e{border:2px dashed rgba(125,255,224,.5);background:none;padding:3px 14px;color:var(--mut)}
#pks{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#pkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px 12px 14px}
.ph{grid-column:1/-1;font-size:16px;font-weight:800;color:var(--acc);padding:8px 2px 2px}
.b{touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative;width:100%;min-width:0;height:var(--rh);padding:0 6px 0 12px;border:2px solid rgba(255,255,255,.12);border-radius:12px;background:none;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);text-align:left;transition:transform .15s,box-shadow .15s,opacity .2s,background .15s}
.bi{flex:none;width:calc(var(--rh) - 14px);height:calc(var(--rh) - 14px);border-radius:50%;border:2px solid rgba(255,255,255,.6);background-size:cover;background-position:center;background-color:#222c5c}
.b:not(.has) .bi{display:none}
.bn{font-size:16px;font-weight:700;line-height:1.1;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (hover:hover){.b:hover{background:rgba(255,204,51,.18);filter:none}}
.b.sel{border-color:var(--acc);background:rgba(255,204,51,.25);box-shadow:0 0 14px var(--acc)}
.b.dis{opacity:.2;pointer-events:none}
.b.lock{opacity:.35;pointer-events:none}
#pkw{flex:none;align-self:center;height:var(--wh);display:flex;gap:16px;padding:10px 20px;background:rgba(8,12,28,.95);border:2px solid var(--acc);border-radius:24px;pointer-events:none;box-shadow:0 0 40px rgba(255,204,51,.25);margin:2px 0 6px}
@keyframes bob2{50%{transform:translate(-50%,calc(-50% - 6px))}}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:calc(var(--bs) + 24px)}
.wb img{width:var(--bs);height:var(--bs);border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 22px rgba(120,160,255,.8)}
.wb b{font-size:16px;text-align:center;line-height:1.15;max-width:calc(var(--bs) + 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb i{font-style:normal;font-size:16px}
.wb i.rt{color:var(--acc)}
.wb i.rn{color:#c9b6ff}
@media (max-width:767px){.bn{font-size:13px}.ph{font-size:14px}.b{padding:0 4px 0 8px}#pkst,.tk,.wb b,.wb i,#tk{font-size:14px}.tk img{width:26px;height:26px}#pkw{padding:6px 10px;gap:8px}}
#kb{position:absolute;transform:translate(-50%,-50%);display:none;background:rgba(8,12,28,.9);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:7px;box-shadow:0 8px 30px rgba(0,0,0,.55);z-index:5;animation:kbp .4s}
@keyframes kbp{from{transform:translate(-50%,-50%) scale(.8);opacity:0}}
#kbs{height:var(--sh);display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap;overflow:hidden}
#kbs b{font-size:22px;letter-spacing:.2em;color:var(--acc)}
#kbs span{color:var(--mut);font-size:16px}
#kbk{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.k{height:var(--kh);padding:0;font-size:16px;font-weight:800;border-radius:8px;background:#222c5c;transition:transform .08s,background .15s}
.k:active,.k.p{transform:scale(.84);background:var(--acc);color:#190808}
.k:disabled{opacity:.2;transform:none;filter:none;background:#222c5c;color:var(--ink);cursor:default}
@media (max-width:767px){.k{font-size:14px}#kbs b{font-size:18px}#kbs span{font-size:13px}#kb{padding:5px}#kbk{gap:2px}}
@media (min-width:768px){#banner{right:230px}}
</style></head>

/* ---------- simulation ---------- */
const POP=['India','Brazil','United States','Japan','Argentina','France','Germany','Pakistan','China','Italy','United Kingdom','Turkey','Spain','Mexico','Nigeria','Russia','South Korea','Canada','Australia','Egypt'];let simT=2,lobT=0;
function uname(){const P=a=>a[Math.random()*a.length|0],F=['aarav','riya','sourav','ankit','priya','rahul','sneha','arjun','meera','vikram','tanmoy','ishaan','debjit','nisha','kabir','shreya','rohan','anika','subho','pooja','karan','diya','aditya','tia'],W=['ninja','pixel','turbo','cosmic','mango','tiger','storm','lazy','panda','nova','chai','frost','shadow','rocket','pro','king','wolf','blaze'],S=['gaming','yt','official','plays','fan','x','real','tv'],r=Math.random(),y=P(['98','99','00','01','02','03','04','05','07']),n=P(F);
 if(r<.22)return n+'_'+y;if(r<.38)return n+(10+Math.random()*90|0);if(r<.52)return P(W)+P(W)+(Math.random()<.5?'':(Math.random()*99|0));if(r<.66)return n+'_'+P(S);if(r<.78)return P(W)+'_'+n;if(r<.88)return '@'+n+P(W);return n[0].toUpperCase()+n.slice(1)+' '+'ABCDEFGHJKMPRSTV'[Math.random()*16|0]+'.'}
function sim(dt){simT-=dt;if(simT>0)return;simT=3+Math.random()*6;if(queue.length>=8)return;const pool=Math.random()<.7?POP:NAMES,n=pool[Math.random()*pool.length|0];if(queue.includes(n))return;queue.push(n);renderQ();feed('📩 '+uname()+' requested '+n);if(st=='lobby')layout()}
function auto(dt){if(st!='lobby'){lobT=0;return}lobT+=dt;if(lobT>5){lobT=0;start()}}
function upd(dt){time+=dt;if(st=='lobby'||st=='count')fs.forEach(f=>f.sc+=(f.tsc-f.sc)*Math.min(1,dt*8));
 if(st=='count'){cd-=dt;if(Math.floor(cd+dt)!=Math.floor(cd)&&cd>0)beep(440,.15,'square',.05);
  if(cd<=0){st='fight';t=0;fs.forEach(f=>{const a=Math.random()*6.28;f.vx=Math.cos(a)*A0*.6;f.vy=Math.sin(a)*A0*.6});beep(700,.35,'square',.08);ui()}}
 if(st=='fight'){t+=dt;ARC=A0*Math.max(.42,1-Math.max(0,t-50)/100);
  const al=fs.filter(f=>f.alive);
  al.forEach(f=>{let tg=null,bd=1e9;al.forEach(o=>{if(o!==f){const d=Math.hypot(o.x-f.x,o.y-f.y);if(d<bd){bd=d;tg=o}}});
   if(tg){const dx=(tg.x-f.x)/bd,dy=(tg.y-f.y)/bd;f.vx+=dx*A0*1.5*dt;f.vy+=dy*A0*1.5*dt;f.dash-=dt;
    if(f.dash<=0){f.dash=1.2+Math.random()*2;f.vx+=dx*A0*1.9;f.vy+=dy*A0*1.9;f.sc=1.22;burst(f.x,f.y,8,pal(f.n),90)}}
   f.vx+=(Math.random()-.5)*A0*3*dt;f.vy+=(Math.random()-.5)*A0*3*dt;
   const k=Math.exp(-1.5*dt);f.vx*=k;f.vy*=k;f.x+=f.vx*dt;f.y+=f.vy*dt;
   const dx=f.x-cx,dy=f.y-cy,d=Math.hypot(dx,dy)||1,lim=ARC-f.r;
   if(d>lim){const nx=dx/d,ny=dy/d;f.x=cx+nx*lim;f.y=cy+ny*lim;const vn=f.vx*nx+f.vy*ny;if(vn>0){f.vx-=1.8*vn*nx;f.vy-=1.8*vn*ny;if(vn>A0*.5){burst(f.x,f.y,4,['#fff','#ffcc33'],60);beep(200,.05,'square',.03)}}}
   f.flash=Math.max(0,f.flash-dt*4);f.sc+=(f.tsc-f.sc)*Math.min(1,dt*8);
   if(t>120)hurt(f,(t-120)*.3*dt)});
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];if(!a.alive||!b.alive)continue;
   let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const md=a.r+b.r;
   if(d<md){const nx=dx/d,ny=dy/d,ov=(md-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
    const vr=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
    if(vr>0){const im=(1.9*vr)/2;a.vx-=im*nx;a.vy-=im*ny;b.vx+=im*nx;b.vy+=im*ny}
    const key=a.id+'-'+b.id;
    if(t-(ph[key]||-9)>.25){ph[key]=t;const base=1.7+Math.abs(vr)/A0*5,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
     [[a,b],[b,a]].forEach(([x,y])=>{let dm=base*y.pow*(.7+Math.random()*.6),cr=Math.random()<.08;if(cr)dm*=2;x.flash=1;txt(x.x,x.y-x.r-6,Math.round(dm)+(cr?'!':''),cr?'#ffcc33':'#fff',cr?1.4:1);hurt(x,dm)});
     burst(mx,my,12,['#fff','#ffcc33','#ff7a4d'],200);shake=Math.max(shake,Math.min(9,base*.5));beep(140+Math.random()*80,.09,'square',.05)}}}
  if(st=='fight'){const al2=fs.filter(f=>f.alive);if(al2.length<=1){if(al2.length)win(al2[0]);else{const c=fs.filter(f=>f.dieT==t).sort((a,b)=>b.over-a.over)[0]||fs[0];c.alive=true;c.hp=5;win(c)}}}}
 if(st=='won'){wt+=dt;const w=winner;w.x+=(cx-w.x)*Math.min(1,dt*3);w.y+=(cy-w.y)*Math.min(1,dt*3);w.sc+=(w.tsc-w.sc)*Math.min(1,dt*5);if(wt<7&&Math.random()<.9)conf();if(Math.random()<.04)burst(Math.random()*Wd,Math.random()*Hd*.6,30,['#ffcc33','#ff4d6d','#6ea8ff'],220);
  if(wt>9){newLobby()}}
 shake*=Math.exp(-6*dt);
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.992;p.l-=dt;p.r+=dt*6});parts=parts.filter(p=>p.l>0&&p.y<Hd+20);
 txts.forEach(a=>{a.y-=50*dt;a.l-=dt});txts=txts.filter(a=>a.l>0)}

/* ---------- drawing ---------- */
function draw(){const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);
 const gr=c.createRadialGradient(cx,cy,10,cx,cy,Math.max(Wd,Hd)*.7);gr.addColorStop(0,'#1a2150');gr.addColorStop(1,'#05070f');c.fillStyle=gr;c.fillRect(0,0,Wd,Hd);
 for(let i=0;i<50;i++){c.globalAlpha=.25+.25*Math.sin(time*2+i);c.fillStyle='#fff';const x=(i*97.3+time*(6+i%5*4))%Wd,y=(i*53.7)%Hd;c.fillRect(x,y,1+i%3,1+i%3)}c.globalAlpha=1;
 c.save();if(shake>.3)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 c.fillStyle='rgba(255,255,255,.05)';c.beginPath();c.arc(cx,cy,ARC,0,7);c.fill();
 for(let i=1;i<4;i++){c.strokeStyle='rgba(255,255,255,'+(.05+.04*Math.sin(time*2+i))+')';c.lineWidth=2;c.beginPath();c.arc(cx,cy,ARC*i/4+Math.sin(time*1.5+i)*3,0,7);c.stroke()}
 if(ARC<A0*.98){c.strokeStyle='rgba(255,60,80,'+(.4+.3*Math.sin(time*6))+')';c.lineWidth=14;c.beginPath();c.arc(cx,cy,ARC+8,0,7);c.stroke()}
 c.setLineDash([14,10]);c.lineDashOffset=-time*30;c.strokeStyle='hsl('+(time*60%360)+',90%,62%)';c.lineWidth=4;c.shadowColor=c.strokeStyle;c.shadowBlur=18;c.beginPath();c.arc(cx,cy,ARC,0,7);c.stroke();c.setLineDash([]);c.shadowBlur=0;
 const F=fsz();
 fs.forEach(f=>{if(!f.alive)return;const bob=(st=='lobby'||st=='count')?Math.sin(time*2.5+f.ph)*5:0,r=f.r*f.sc;
  c.save();c.translate(f.x,f.y+bob);c.rotate(Math.sin(time*3+f.ph)*.08+f.vx*.0006);
  c.shadowColor=st=='won'?'#ffcc33':'rgba(120,160,255,.8)';c.shadowBlur=st=='won'?40:18;c.fillStyle='#000';c.beginPath();c.arc(0,0,r,0,7);c.fill();c.shadowBlur=0;
  c.save();c.beginPath();c.arc(0,0,r,0,7);c.clip();c.drawImage(f.fl,-r*1.5,-r,r*3,r*2);
  const sg=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);sg.addColorStop(0,'rgba(255,255,255,.28)');sg.addColorStop(.6,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,.4)');c.fillStyle=sg;c.fillRect(-r,-r,2*r,2*r);
  if(f.flash>0){c.fillStyle='rgba(255,255,255,'+f.flash*.8+')';c.fillRect(-r,-r,2*r,2*r)}c.restore();
  c.lineWidth=4;c.strokeStyle=st=='won'?'#ffcc33':'#fff';c.beginPath();c.arc(0,0,r,0,7);c.stroke();c.restore();
  c.textAlign='center';c.lineJoin='round';
  if(st=='won'){c.font=(r*.9)+'px system-ui';c.fillText('👑',f.x,f.y-r-6+Math.sin(time*3)*5)}
  else{const bw=r*2,bx=f.x-r,by=f.y+bob-r-16;c.fillStyle='rgba(0,0,0,.6)';c.fillRect(bx-2,by-2,bw+4,11);c.fillStyle='hsl('+f.hp*1.2+',85%,55%)';c.fillRect(bx,by,bw*f.hp/100,7)}
  c.font='800 '+F+'px system-ui,sans-serif';c.lineWidth=4;c.strokeStyle='#000';c.strokeText(f.n,f.x,f.y+bob+r+F+4);c.fillStyle='#fff';c.fillText(f.n,f.x,f.y+bob+r+F+4);if(st=='count'||st=='lobby'){const tg2=f.kind=='win'?'🏆 RETURNING':f.kind=='rnd'?'🎲 RANDOM':'🆕 NEW';c.fillStyle=f.kind=='win'?'#ffcc33':f.kind=='rnd'?'#c9b6ff':'#7dffe0';c.strokeText(tg2,f.x,f.y+bob+r+F*2+8);c.fillText(tg2,f.x,f.y+bob+r+F*2+8)}});
 parts.forEach(p=>{c.globalAlpha=Math.max(0,Math.min(1,p.l/p.m*1.5));c.fillStyle=p.c;if(p.sq){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}else{c.beginPath();c.arc(p.x,p.y,p.s*Math.max(.2,p.l/p.m),0,7);c.fill()}});c.globalAlpha=1;
 txts.forEach(a=>{c.globalAlpha=Math.min(1,a.l*1.5);c.font='900 '+Math.round(F*1.2*a.z)+'px system-ui';c.textAlign='center';c.lineWidth=4;c.strokeStyle='#000';c.strokeText(a.s,a.x,a.y);c.fillStyle=a.c;c.fillText(a.s,a.x,a.y)});c.globalAlpha=1;
 c.restore();
 if(st=='count'){const n=Math.ceil(cd-.4),s=(cd-.4)%1,z=Math.min(Wd,Hd)*.28;c.textAlign='center';c.textBaseline='middle';c.font='900 '+(cd>.4?z*(.8+s*.5):z*.6)+'px system-ui';c.globalAlpha=cd>.4?.4+s*.6:1;c.lineWidth=8;c.strokeStyle='#000';const tx=cd>.4?String(n):'FIGHT!';c.strokeText(tx,cx,cy);c.fillStyle='#ffcc33';c.fillText(tx,cx,cy);c.globalAlpha=1;c.textBaseline='alphabetic'}}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;try{upd(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}

/* ---------- input ---------- */
function find(v){v=v.trim().toLowerCase();if(!v)return null;if(AL[v])return AL[v];const m=NAMES.find(n=>n.toLowerCase()==v);if(m)return m;const p=NAMES.filter(n=>n.toLowerCase().startsWith(v));return p.length==1?p[0]:null}
function msg(s,bad){const m=$('msg');m.textContent=s;m.className=bad?'bad':''}
function add(){const i=$('inp'),n=find(i.value);
 if(!n){if(!i.value.trim())return;i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');msg('“'+i.value.trim()+'” isn’t in my flag list yet. Pick one from the suggestions.',1);return}
 if(queue.includes(n)){msg(n+' is already in the queue.',1);i.select();return}
 queue.push(n);i.value='';i.classList.remove('bad');renderQ();msg(n+' added'+(cupNext?' – joins after the Champions Cup.':st=='lobby'?' – joins this round!':' – joins the next round.'));if(st=='lobby')layout();i.focus()}
function renderQ(){const q=$('q');q.innerHTML=queue.length?'<span class="dim">Up next:</span>':'<span class="dim">No requests yet. Viewers’ countries will appear here.</span>';
 queue.forEach((n,i)=>{const d=document.createElement('span');d.className='chip'+(i<6?' nx':'');d.textContent=n;const x=document.createElement('b');x.textContent='✕';x.title='Remove';x.onclick=()=>{queue.splice(queue.indexOf(n),1);renderQ();if(st=='lobby')layout()};d.appendChild(x);q.appendChild(d)})}
