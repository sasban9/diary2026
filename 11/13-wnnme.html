<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New Near Me — MVP</title>
<meta name="description" content="Discover newly arrived products at shops around you.">
<meta property="og:title" content="What’s New Near Me">
<meta property="og:description" content="Hyperlocal new-arrivals discovery for neighbourhood shops.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://example.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="What’s New Near Me">
<meta name="twitter:description" content="Hyperlocal new-arrivals discovery for neighbourhood shops.">
<meta name="twitter:image" content="https://example.com/og.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0a;--card:#181612;--line:#2a2620;--ink:#f3ede0;--mute:#a79f8e;--gold:#e8b04a;--acid:#c5f04a;--min:14px;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4efe4;--card:#fffaf0;--line:#ddd3be;--ink:#1c1912;--mute:#6d6554;--gold:#a56d00;--acid:#4d7a00;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 var(--min)/1.45 'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
@media(min-width:768px){:root{--min:16px}body{background:radial-gradient(circle at 30% 20%,#2b2112,var(--bg) 60%);padding:20px}}
.app{width:100%;height:100%;max-width:440px;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:768px){.app{height:min(900px,100%);border:1px solid var(--line);border-radius:36px;box-shadow:0 30px 80px #000a}}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 8px;scrollbar-width:none}
.scr{display:none}.scr.on{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1,h2{font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(28px,7vw,34px);line-height:1.05}
h1 em,h2 em{font:italic 600 1.15em 'Cormorant Garamond',serif;color:var(--gold)}
.sub{color:var(--mute);font-size:var(--min)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer;transition:.2s}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.pulse{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:14px 0 4px}
.pulse div{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;animation:pop .6s both}
.pulse b{display:block;font-size:26px;color:var(--acid);line-height:1}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.range{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
input[type=range]{flex:1;accent-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;animation:rise .55s both;transition:transform .25s}
.tile:hover{transform:translateY(-4px)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ph{height:112px;display:grid;place-items:center;position:relative;font:italic 600 64px 'Cormorant Garamond',serif;color:#0006;overflow:hidden}
.ph::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#fff2;right:-24px;top:-24px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translate(-14px,14px) scale(1.15)}}
.heart{position:absolute;right:8px;bottom:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px;cursor:pointer;transition:.2s}
.heart.on{background:var(--gold);color:#111;transform:scale(1.15)}
.tag{position:absolute;left:8px;top:8px;z-index:2;background:var(--acid);color:#111;font-size:var(--min);font-weight:600;padding:1px 9px;border-radius:99px}
.tb{padding:10px 12px 12px}.tb b{display:block}.tb .price{color:var(--gold);font-weight:600}
.out{opacity:.45}
.back{background:none;border:0;color:var(--gold);font:inherit;cursor:pointer;padding:0 0 10px}
.hero{border-radius:22px;padding:22px;margin:4px 0 14px;position:relative;overflow:hidden;color:#111}
.hero h2{font-size:30px;line-height:1.05}.hero p{color:#000a}
.row{display:flex;gap:10px;margin:14px 0}
.btn{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 var(--min) inherit;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;transition:.2s}
.btn.pri{background:var(--gold);color:#111;border-color:var(--gold)}.btn.wa{background:#25d366;color:#08210f;border-color:#25d366}
.btn:active{transform:scale(.96)}
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:99px;font:inherit;cursor:pointer}
.seg .on{background:var(--gold);color:#111;font-weight:600}
.map{height:150px;border-radius:18px;border:1px solid var(--line);background:
 repeating-linear-gradient(0deg,transparent 0 29px,var(--line) 29px 30px),repeating-linear-gradient(90deg,transparent 0 29px,var(--line) 29px 30px);position:relative;margin:12px 0}
.pin{position:absolute;left:55%;top:42%;width:18px;height:18px;border-radius:50%;background:var(--gold)}
.pin::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--gold);animation:ping 1.8s infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font-size:28px;color:var(--acid);line-height:1.1}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .4s both}
.item .sw{width:44px;height:44px;border-radius:12px;flex:none}.item div{flex:1;min-width:0}
.mini{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;cursor:pointer}
.mini.on{background:var(--acid);color:#111;border-color:var(--acid)}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;padding:8px 4px;cursor:pointer;position:relative;transition:.2s}
nav button.on{color:var(--gold);font-weight:600}
nav button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;background:var(--gold);border-radius:3px;animation:pop .3s}
.toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,30px);background:var(--acid);color:#111;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<div class="app">
<main>
 <section class="scr on" id="discover">
  <p class="sub">Your neighbourhood · <span id="rv">3</span> km</p>
  <h1>Fresh arrivals <em>around you</em></h1>
  <div class="pulse" id="pulse"></div>
  <div class="chips" id="chips"></div>
  <div class="range"><span class="sub">Distance</span><input type="range" id="range" min="0.5" max="3" step="0.1" value="3"></div>
  <div class="grid" id="feed"></div>
 </section>
 <section class="scr" id="shop">
  <button class="back" id="back">← Back</button>
  <div class="hero" id="hero"></div>
  <div class="seg"><button class="on" data-t="cat">Catalogue</button><button data-t="prof">Profile</button></div>
  <div id="shopbody"></div>
 </section>
 <section class="scr" id="saved">
  <h1>Saved <em>finds</em></h1><p class="sub">Products you want to see in person</p>
  <div class="grid" id="savedgrid" style="margin-top:16px"></div>
 </section>
 <section class="scr" id="dash">
  <p class="sub">Merchant dashboard</p>
  <h1>Riya Fashion <em>· My Shop</em></h1>
  <div class="stats"><div class="stat"><b id="s1">0</b>Views</div><div class="stat"><b id="s2">0</b>Enquiries</div><div class="stat"><b id="s3">0</b>Directions</div></div>
  <h2 style="font-size:20px;margin-bottom:8px">Add a new arrival</h2>
  <form id="form">
   <input id="pn" placeholder="Product name" required>
   <input id="pp" type="number" placeholder="Price (₹)" required>
   <select id="pc"></select>
   <button class="btn pri" type="submit">Publish in 20 seconds</button>
  </form>
  <h2 style="font-size:20px">Your products</h2><div id="mine"></div>
 </section>
</main>
<div class="toast" id="toast"></div>
<nav><button class="on" data-s="discover">Discover</button><button data-s="saved">Saved</button><button data-s="dash">My Shop</button></nav>
</div>
<script>
const $=s=>document.querySelector(s),cats=['All','Fashion','Footwear','Electronics','Home decor','Gifts'];
const shops=[
{id:0,name:'Riya Fashion',area:'Kapil Vihar',d:.45,c:'#e8b04a',wa:'919800000001',addr:'12 Market Rd, Kapil Vihar',hrs:'10 am – 9 pm',about:'Cotton kurtis and festive wear since 2011.'},
{id:1,name:'Tech Corner',area:'Central Park',d:.8,c:'#c5f04a',wa:'919800000002',addr:'4 Central Park Arcade',hrs:'11 am – 9:30 pm',about:'Earbuds, chargers and phone accessories.'},
{id:2,name:'Home Studio',area:'Lake Town',d:1.2,c:'#f08a6a',wa:'919800000003',addr:'88 Lake Town Block A',hrs:'10 am – 8 pm',about:'Handpicked decor for small homes.'},
{id:3,name:'Walk In',area:'Salt Lake',d:1.5,c:'#7fd1e0',wa:'919800000004',addr:'21 City Centre Lane',hrs:'10 am – 9 pm',about:'Sneakers and everyday footwear.'},
{id:4,name:'Gift Nest',area:'Kapil Vihar',d:2.4,c:'#d9a4f0',wa:'919800000005',addr:'7 Station Road',hrs:'10:30 am – 8:30 pm',about:'Gifts, toys and festival hampers.'}];
let P=[['New cotton kurtis',899,'Fashion',0,'Today'],['Block-print dupatta',499,'Fashion',0,'Today'],['Wireless earbuds',1299,'Electronics',1,'Today'],['20W fast charger',599,'Electronics',1,'Yesterday'],['Ceramic vase set',749,'Home decor',2,'Yesterday'],['Woven wall hanging',1099,'Home decor',2,'Today'],['White sneakers',1999,'Footwear',3,'Yesterday'],['Kolhapuri sandals',799,'Footwear',3,'Today'],['Festival gift hamper',1499,'Gifts',4,'Today'],['Wooden puzzle toy',349,'Gifts',4,'Yesterday']].map((a,i)=>({id:i,n:a[0],p:a[1],c:a[2],s:a[3],when:a[4],stock:true,saved:false}));
let cat='All',maxd=3,cur=0,tab='cat',st={v:0,e:0,d:0},nid=100;
const money=n=>'₹'+n.toLocaleString('en-IN');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function tile(p,i){const s=shops[p.s];return `<div class="tile ${p.stock?'':'out'}" style="animation-delay:${i*60}ms" data-shop="${s.id}">
<div class="ph" style="background:${s.c}"><span class="tag">${p.stock?p.when:'Sold out'}</span>${p.n[0]}<button class="heart ${p.saved?'on':''}" data-save="${p.id}" aria-label="Save">♥</button></div>
<div class="tb"><b>${p.n}</b><span class="price">${money(p.p)}</span><div class="sub">${s.name} · ${s.d<1?Math.round(s.d*1000)+' m':s.d+' km'}</div></div></div>`}
function renderFeed(){
 const l=P.filter(p=>(cat=='All'||p.c==cat)&&shops[p.s].d<=maxd).sort((a,b)=>shops[a.s].d-shops[b.s].d);
 $('#feed').innerHTML=l.length?l.map(tile).join(''):'<p class="empty" style="grid-column:1/-1">Nothing new in this range yet.</p>';
 const t=P.filter(p=>p.when=='Today'||p.when=='Just now');
 $('#pulse').innerHTML=cats.slice(1).map((c,i)=>{const n=t.filter(p=>p.c==c).length;return n?`<div style="animation-delay:${i*90}ms"><b>${n}</b>${c} today</div>`:''}).join('');
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-cat="${c}">${c}</button>`).join('');
 renderSaved();renderMine();
}
function renderSaved(){const l=P.filter(p=>p.saved);$('#savedgrid').innerHTML=l.length?l.map(tile).join(''):'<p class="empty" style="grid-column:1/-1">Tap ♥ on a product to save it.</p>'}
function openShop(id){cur=id;st.v+=id==0?1:0;tab='cat';go('shop');renderShop()}
function renderShop(){
 const s=shops[cur];
 $('#hero').style.background=s.c;
 $('#hero').innerHTML=`<h2>${s.name}</h2><p>${s.area} · ${s.d<1?Math.round(s.d*1000)+' m':s.d+' km'} away · Open now</p><p>${s.about}</p>`;
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 if(tab=='cat'){const l=P.filter(p=>p.s==cur);$('#shopbody').innerHTML=`<div class="grid">${l.map(tile).join('')}</div>`}
 else $('#shopbody').innerHTML=`<div class="map"><div class="pin"></div></div>
 <div class="kv"><span>Address</span><span style="text-align:right">${s.addr}</span></div>
 <div class="kv"><span>Hours</span><span>${s.hrs}</span></div>
 <div class="kv"><span>Products</span><span>${P.filter(p=>p.s==cur).length} listed</span></div>
 <div class="row"><a class="btn wa" data-act="e" target="_blank" rel="noopener" href="https://wa.me/${s.wa}?text=Hi!%20I%20saw%20your%20new%20arrivals">WhatsApp</a><a class="btn pri" data-act="d" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(s.addr)}">Directions</a></div>
 <button class="btn" id="follow" style="width:100%">+ Follow for new arrivals</button>`;
}
function renderMine(){
 $('#s1').textContent=st.v;$('#s2').textContent=st.e;$('#s3').textContent=st.d;
 const l=P.filter(p=>p.s==0);
 $('#mine').innerHTML=l.map(p=>`<div class="item"><div class="sw" style="background:${shops[0].c}"></div><div><b>${p.n}</b><div class="sub">${money(p.p)} · ${p.c}</div></div>
 <button class="mini ${p.stock?'on':''}" data-stock="${p.id}">${p.stock?'In stock':'Sold out'}</button><button class="mini" data-del="${p.id}" aria-label="Delete">✕</button></div>`).join('')||'<p class="empty">No products yet.</p>';
}
function go(id){
 document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
 const m=id=='shop'?'discover':id;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s==m));
 $('main').scrollTop=0;
}
document.addEventListener('click',e=>{
 const t=e.target,q=a=>t.closest('['+a+']');
 let x;
 if(x=q('data-save')){const p=P[P.findIndex(p=>p.id==x.dataset.save)];p.saved=!p.saved;toast(p.saved?'Saved ♥':'Removed');const sc=document.querySelector('.scr.on').id;renderFeed();if(sc=='shop')renderShop();return}
 if(x=q('data-cat')){cat=x.dataset.cat;renderFeed();return}
 if(x=q('data-shop')){openShop(+x.dataset.shop);return}
 if(x=q('data-s')){go(x.dataset.s);return}
 if(x=q('data-t')){tab=x.dataset.t;renderShop();return}
 if(x=q('data-act')){if(cur==0){st[x.dataset.act]++;renderMine()}return}
 if(x=q('data-stock')){const p=P.find(p=>p.id==x.dataset.stock);p.stock=!p.stock;renderFeed();return}
 if(x=q('data-del')){P=P.filter(p=>p.id!=x.dataset.del);renderFeed();toast('Removed');return}
 if(t.id=='back')go('discover');
 if(t.id=='follow'){t.textContent='✓ Following';t.classList.add('pri');toast('You’ll be notified')}
});
$('#range').oninput=e=>{maxd=+e.target.value;$('#rv').textContent=maxd;renderFeed()};
$('#pc').innerHTML=cats.slice(1).map(c=>`<option>${c}</option>`).join('');
$('#form').onsubmit=e=>{e.preventDefault();
 P.unshift({id:nid++,n:$('#pn').value,p:+$('#pp').value,c:$('#pc').value,s:0,when:'Just now',stock:true,saved:false});
 e.target.reset();renderFeed();toast('Live in your neighbourhood feed')};
renderFeed();
</script>
</body>
</html>
