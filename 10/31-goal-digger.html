<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goal-Digger Giving Frenzy</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b1220;--card:#141d33;--line:#26335a;--tx:#eef2ff;--mut:#9aa7cf;--acc:#22d3a0;--hot:#ff5d73;--gold:#ffc83d;--dark:#05080f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6ff;--card:#fff;--line:#cfd8f5;--tx:#0d1530;--mut:#51608f;--dark:#222b47}}
html{color-scheme:dark light;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{text-align:center;padding:18px 12px 6px}
h1{margin:0;font-size:clamp(20px,4vw,30px);letter-spacing:.5px}
nav{display:flex;gap:6px;justify-content:center;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{font:inherit;font-size:15px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.25s}
nav button.on{background:var(--acc);color:#04251c;border-color:var(--acc);transform:translateY(-2px)}
main{max-width:760px;margin:0 auto;padding:4px 12px 12px}
.tab{display:none;animation:in .4s ease}.tab.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 0}
#qr{background:#fff;padding:16px;border-radius:18px;box-shadow:0 0 0 4px var(--acc),0 20px 50px #0006;animation:pulse 3s ease-in-out infinite}
#qr img,#qr canvas{display:block;max-width:100%}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--acc),0 20px 60px #22d3a055}}
.qrbox input{width:100%;max-width:420px;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.mut{color:var(--mut);font-size:15px;text-align:center}
.wrap{overflow:visible}
table{display:flex;flex-direction:column;width:100%;height:100%;min-width:0}
thead{display:block;flex:none;margin-bottom:6px}
#head,tbody tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
tbody{display:grid;flex:1;min-height:0;grid-template-rows:repeat(12,minmax(40px,1fr));gap:4px}
th{display:block;min-width:0}
td{display:flex;padding:0;min-width:0}
th{padding:6px 2px;position:sticky;top:calc(var(--nh,62px) + env(safe-area-inset-top,0px));background:var(--bg);z-index:3}
th small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
th .av{width:min(96px,15vw,9dvh);height:auto;aspect-ratio:1}.win .av{max-width:70vw;height:auto;aspect-ratio:1}
.av{border-radius:50%;display:inline-block;vertical-align:middle;object-fit:cover}
.phb{background:none;border:0;padding:0;cursor:pointer;transition:transform .2s}.phb:hover{transform:scale(1.15) rotate(-4deg)}
th .av{animation:bob 2.6s ease-in-out infinite}th:nth-child(2n) .av{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-4px)}}
.bar{height:5px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
td button{width:100%;font:inherit;font-size:18px;font-weight:700;padding:0;flex:1;min-height:0;line-height:1;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;transition:transform .15s,background .3s}
td button{border-bottom:3px solid var(--pc)}
td button:hover:not(:disabled){transform:scale(1.08);background:var(--pc);color:#fff}
td button:disabled{background:var(--dark);color:#3a4468;border-color:var(--dark);cursor:not-allowed;animation:pop .45s}
@keyframes pop{40%{transform:scale(.8)}}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;gap:10px}
.rematch{font:inherit;font-weight:800;letter-spacing:1px;padding:10px 18px;border-radius:10px;border:0;background:var(--hot);color:#fff;cursor:pointer}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;animation:in .4s ease}
li b{font-size:17px}li span{color:var(--mut);font-size:15px}li em{font-style:normal;color:var(--gold);font-weight:800;font-size:18px;white-space:nowrap}
.modal,.win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20;padding:16px}
.modal.on,.win.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:360px;animation:in .3s ease}
.box h2{margin:0 0 4px}.box input{width:100%;font:inherit;padding:12px;margin:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:10px;border:0;cursor:pointer}
.ok{background:var(--acc);color:#04251c}.no{background:var(--line);color:var(--tx)}
.win{flex-direction:column;gap:22px;background:#000c;z-index:30;text-align:center}
.win h2{font-size:clamp(30px,8vw,64px);margin:0;color:var(--gold);animation:pulse2 1s infinite alternate}
@keyframes pulse2{to{transform:scale(1.07)}}
#big{font:inherit;font-weight:900;letter-spacing:2px;font-size:18px;padding:14px 26px;border-radius:14px;border:0;background:var(--hot);color:#fff;cursor:pointer;transition:all .8s cubic-bezier(.2,1.4,.4,1);opacity:.0}
#big.big{opacity:1;font-size:clamp(28px,8vw,56px);padding:28px 48px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
@media (min-width:768px){nav button,.mut,li span,th small,.rematch,.row button{font-size:16px}}
#t2.on{display:flex;flex-direction:column;height:calc(100vh - var(--nh,62px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px);height:calc(100dvh - var(--nh,62px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px)}
#t2 .wrap{flex:1;min-height:0}
th{position:static}th small{margin-top:0;line-height:1.1}.bar{margin-top:2px}
@media (max-width:767px){td button{font-size:16px}}
.dh{display:flex;width:100%;align-items:center;gap:10px;font:inherit;padding:14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;text-align:left;transition:border-color .3s}
.dd{flex:1;font-weight:700;font-size:17px}.dn{color:var(--mut);font-size:15px}
.dh em{font-style:normal;color:var(--gold);font-weight:800;font-size:18px}
.ch{font-style:normal;color:var(--mut);transition:transform .3s}.day.open>.dh .ch{transform:rotate(180deg)}.day.open>.dh{border-color:var(--acc)}.sub{margin-left:12px}.sub>.dh{background:var(--bg)}.dd .av{margin-left:6px}
.dl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.day.open>.dl{grid-template-rows:1fr}.dl>div{overflow:hidden;min-height:0}
@media (min-width:768px){.dn{font-size:16px}}
</style>
</head>
<body>
<nav><button class="on" data-t="t1">QR Code</button><button data-t="t2">Board</button><button data-t="t3">Donations</button></nav>
<main>
<section class="tab on" id="t1"><div class="qrbox"><div id="qr"></div>
<div class="mut">Scan to donate, then pick a number on the Board tab.</div>
<div class="mut">Tap a player to use a real photo</div><div id="ph" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center"></div><input type="file" id="file" accept="image/*" hidden></div></section>
<section class="tab" id="t2"><div class="top"><div class="mut" id="total"></div><button class="rematch" id="rm">REMATCH</button></div>
<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section>
<section class="tab" id="t3"><div class="top"><div class="mut" id="sum"></div><button class="rematch" id="cp" style="background:var(--line);color:var(--tx)">Copy data</button></div><ul id="list"></ul></section>
</main>
<div class="modal" id="modal"><div class="box"><h2 id="mamt"></h2><div class="mut" id="mfor"></div>

<div class="row"><button class="no" id="mc">Cancel</button><button class="ok" id="ms">Submit</button></div></div></div>

// board
function render(){
 $("head").innerHTML=P.map((p,c)=>{const n=S.entries.filter(e=>e.c===c&&e.r<R&&(e.m||0)===S.match).length;
  return `<th>${av(c,96)}<small>${n}/${R}</small><div class="bar"><i style="width:${n/R*100}%"></i></div></th>`}).join("");
 let h="";for(let r=0;r<R;r++){h+="<tr>";for(let c=0;c<5;c++){const t=taken(r,c);
  h+=`<td><button style="--pc:${A[c].pc}" data-r="${r}" data-c="${c}" ${t||S.winner!==null?"disabled":""}>${val(r,c)}</button></td>`}h+="</tr>"}
 $("body").innerHTML=h;
 const tot=S.entries.reduce((a,e)=>a+e.amt,0);
 $("total").textContent=`Total raised: ${S.entries.filter(e=>(e.m||0)===S.match).reduce((a,e)=>a+e.amt,0).toLocaleString("en-IN")}`;
 $("sum").textContent=`${S.entries.length} donations · total ${tot.toLocaleString("en-IN")}`;
 const l=[...S.entries].sort((a,b)=>b.ts-a.ts),g={};
 l.forEach(e=>{const k=dayKey(e.ts);(g[k]=g[k]||[]).push(e)});
 const sm=a=>a.reduce((x,e)=>x+e.amt,0).toLocaleString("en-IN");
 const hd=(k,lab,n,t)=>`<button class="dh" aria-expanded="${OPEN.has(k)}"><span class="dd">${lab}</span><span class="dn">${n}</span><em>${t}</em><i class="ch">\u25be</i></button>`;
 $("list").innerHTML=l.length?Object.keys(g).map(k=>{const a=g[k],ms=[...new Set(a.map(e=>e.m||0))].sort((x,y)=>y-x);
  const inner=!OPEN.has(k)?"":ms.map((m,i)=>{const b=a.filter(e=>(e.m||0)===m),mk=k+"#"+m;
   const w=[0,1,2,3,4].find(c=>b.filter(e=>e.c===c&&e.r<R).length===R);
   const lab=`\u26bd ${ms.length-i}${w!==undefined?" \ud83c\udfc6 "+av(w,34):""}`;
   return `<div class="day sub${OPEN.has(mk)&&mk!==PEND?" open":""}" data-k="${mk}">${hd(mk,lab,b.length+"\u00d7",sm(b))}<div class="dl"><div>${!OPEN.has(mk)?"":b.map(e=>`<li><div style="display:flex;gap:10px;align-items:center">${av(e.c,88)}<div><b>${esc(e.name)}</b><br><span>${new Date(e.ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</span></div></div><em>${e.amt}</em></li>`).join("")}</div></div></div>`}).join("");
  return `<div class="day${OPEN.has(k)&&k!==PEND?" open":""}" data-k="${k}">${hd(k,new Date(a[0].ts).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}),"\u26bd\u00d7"+ms.length,sm(a))}<div class="dl"><div>${inner}</div></div></div>`}).join(""):'<div class="mut">No donations yet.</div>';
}
let cur=null;
$("body").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
 cur={r:+b.dataset.r,c:+b.dataset.c};
 $("mamt").textContent="Donation: "+val(cur.r,cur.c);$("mfor").innerHTML=av(cur.c,160);
 $("mname").value="";$("modal").classList.add("on");setTimeout(()=>$("mname").focus(),50)};
$("list").onclick=e=>{const h=e.target.closest(".dh");if(!h)return;const d=h.parentNode,k=d.dataset.k;
 if(!OPEN.has(k)){PEND=k;OPEN.add(k);render();PEND=null;requestAnimationFrame(()=>requestAnimationFrame(()=>{const n=[...document.querySelectorAll(".day")].find(x=>x.dataset.k===k);if(n){n.classList.add("open");n.querySelector(".dh").setAttribute("aria-expanded","true")}}))}
 else{OPEN.delete(k);d.classList.remove("open");h.setAttribute("aria-expanded","false");setTimeout(render,400)}};
$("cp").onclick=async()=>{const nw=S.entries.filter(e=>!BK.has(kf(e)));if(!nw.length){$("cp").textContent="Nothing new";setTimeout(()=>$("cp").textContent="Copy data",1800);return}const t=JSON.stringify({entries:nw,match:S.match||0});let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{ok=document.execCommand("copy")}catch(_){}a.remove()}
 $("cp").textContent=ok?"Copied \u2713":"Copy failed";setTimeout(()=>$("cp").textContent="Copy data",1800)};
$("mc").onclick=()=>$("modal").classList.remove("on");
function submit(){const name=$("mname").value.trim();if(!name){$("mname").focus();return}
 if(!cur||taken(cur.r,cur.c))return;
 S.entries.push({r:cur.r,c:cur.c,name,amt:val(cur.r,cur.c),ts:Date.now(),m:S.match});
 const full=S.entries.filter(e=>e.c===cur.c&&e.r<R&&(e.m||0)===S.match).length===R;
 if(full&&S.winner===null)S.winner=cur.c;
 save();$("modal").classList.remove("on");render();
 if(full&&S.winner===cur.c)celebrate(true)}
$("ms").onclick=submit;
$("mname").onkeydown=e=>{if(e.key==="Enter")submit();if(e.key==="Escape")$("mc").onclick()};

// rematch
let armed=0;
$("rm").onclick=()=>{if(!armed){$("rm").textContent="SURE? TAP AGAIN";armed=setTimeout(()=>{armed=0;$("rm").textContent="REMATCH"},3000);return}reset()};
$("big").onclick=reset;
function reset(){clearTimeout(armed);armed=0;S={entries:S.entries,qr:S.qr,winner:null,photos:S.photos||{},match:(S.match||0)+1};save();
 
 $("win").classList.remove("on");$("big").classList.remove("big");$("rm").textContent="REMATCH";render()}

// confetti
const cv=$("cf"),cx=cv.getContext("2d");let parts=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",size);size();
function burst(){const cols=["#ffc83d","#22d3a0","#ff5d73","#6aa6ff","#c78bff"];
 for(let i=0;i<160;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,w:6+Math.random()*7,h:4+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[i%5]})}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 parts=parts.filter(p=>p.y<cv.height+20);
 if(parts.length)raf=requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}
function celebrate(anim){$("wt").innerHTML="🏆<br>"+av(S.winner,300)+"<br>🏆";
 $("win").classList.add("on");
 if(anim){burst();setTimeout(burst,900);setTimeout(burst,1800);cancelAnimationFrame(raf);tick();
  setTimeout(()=>$("big").classList.add("big"),3000)}
 else $("big").classList.add("big")}

const setNh=()=>document.documentElement.style.setProperty("--nh",document.querySelector("nav").offsetHeight+"px");setNh();addEventListener("resize",setNh);
drawQR();drawPh();render();
if(S.winner!==null)celebrate(false);
</script>
